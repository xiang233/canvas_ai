<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Student Agent</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1a1f2b; --muted: #6b7280;
    --accent: #4f46e5; --accent-soft: #eef2ff; --border: #e5e7eb;
    --user: #4f46e5; --tool: #f0fdf4; --tool-ink: #166534; --err: #fef2f2; --err-ink: #b91c1c;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--bg); color: var(--ink); height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { font-size: 17px; font-weight: 650; }
  header .tag { font-size: 12.5px; color: var(--muted); }
  header .dot { color: #d1d5db; }
  main {
    width: 100%; max-width: 760px; flex: 1; overflow-y: auto;
    padding: 28px 20px 12px; display: flex; flex-direction: column; gap: 18px;
  }
  .msg { max-width: 80%; line-height: 1.55; font-size: 14.5px; white-space: pre-wrap; }
  .user {
    align-self: flex-end; background: var(--user); color: #fff;
    padding: 10px 14px; border-radius: 16px 16px 4px 16px;
  }
  .agent {
    align-self: flex-start; background: var(--panel); border: 1px solid var(--border);
    padding: 12px 16px; border-radius: 16px 16px 16px 4px; width: 80%;
  }
  .trace { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
  .trace:empty { display: none; }
  .pill {
    font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--tool); color: var(--tool-ink); border-radius: 8px;
    padding: 4px 10px; display: flex; align-items: center; gap: 7px; width: fit-content;
  }
  .pill.err { background: var(--err); color: var(--err-ink); }
  .pill .dur { color: var(--muted); }
  .spinner {
    width: 10px; height: 10px; border: 2px solid #86efac; border-top-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .answer { min-height: 1em; }
  .caret::after { content: "▍"; color: var(--accent); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: auto 0; }
  .suggest button {
    background: var(--panel); border: 1px solid var(--border); color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .suggest button:hover { border-color: var(--accent); color: var(--accent); }
  form {
    width: 100%; max-width: 760px; padding: 12px 20px 20px;
    display: flex; gap: 10px;
  }
  input[type=text] {
    flex: 1; border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; font-size: 14.5px; background: var(--panel); outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button.send {
    background: var(--accent); color: #fff; border: 0; border-radius: 12px;
    padding: 0 20px; font-size: 14.5px; font-weight: 600; cursor: pointer;
  }
  button.send:disabled { opacity: .45; cursor: default; }
  footer { font-size: 11.5px; color: var(--muted); padding-bottom: 14px; }
</style>
</head>
<body>
<header>
  <h1>Canvas Student Agent</h1>
  <span class="tag">ReAct agent <span class="dot">·</span> 23 read-only Canvas tools
    <span class="dot">·</span> per-session memory <span class="dot">·</span> SSE streaming</span>
</header>

<main id="log">
  <div class="suggest" id="suggest">
    <button>What are my current grades?</button>
    <button>Who teaches the Deep Reinforcement Learning course?</button>
    <button>What is the latest announcement in Deep RL?</button>
    <button>What does the course material say about expectation maximization?</button>
  </div>
</main>

<form id="form" autocomplete="off">
  <input id="input" type="text" placeholder="Ask about your courses, grades, deadlines, or lecture content…">
  <button class="send" id="send" type="submit">Send</button>
</form>
<footer id="foot">session: new</footer>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const foot = document.getElementById("foot");
let sessionId = null, busy = false, msgCount = 0;

document.getElementById("suggest").addEventListener("click", e => {
  if (e.target.tagName === "BUTTON") { input.value = e.target.textContent; form.requestSubmit(); }
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || busy) return;
  busy = true; send.disabled = true; input.value = "";
  document.getElementById("suggest")?.remove();

  const u = document.createElement("div");
  u.className = "msg user"; u.textContent = q; log.appendChild(u);

  const a = document.createElement("div");
  a.className = "msg agent";
  a.innerHTML = '<div class="trace"></div><div class="answer caret"></div>';
  log.appendChild(a);
  const trace = a.querySelector(".trace"), answer = a.querySelector(".answer");
  scroll();

  try {
    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: q, session_id: sessionId }),
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", activePills = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const dataLine = frame.split("\n").find(l => l.startsWith("data: "));
        if (!dataLine) continue;
        handle(JSON.parse(dataLine.slice(6)));
      }
    }

    function handle(ev) {
      if (ev.type === "session") {
        sessionId = ev.session_id;
        foot.textContent = "session: " + sessionId.slice(0, 8) + " · turn " + (++msgCount);
      } else if (ev.type === "tool_call") {
        const p = document.createElement("div");
        p.className = "pill";
        p.innerHTML = '<span class="spinner"></span><span>' + ev.tool + "</span>";
        trace.appendChild(p); activePills.push(p); scroll();
      } else if (ev.type === "step") {
        activePills.forEach(p => {
          p.querySelector(".spinner")?.remove();
          p.insertAdjacentHTML("afterbegin", "✓ ");
        });
        if (activePills.length && ev.duration_s != null)
          activePills[activePills.length - 1].insertAdjacentHTML(
            "beforeend", '<span class="dur">' + ev.duration_s + "s</span>");
        activePills = [];
      } else if (ev.type === "answer_chunk") {
        answer.textContent += ev.text; scroll();
      } else if (ev.type === "error") {
        const p = document.createElement("div");
        p.className = "pill err"; p.textContent = "⚠ " + ev.message.slice(0, 120);
        trace.appendChild(p); scroll();
      } else if (ev.type === "done") {
        answer.classList.remove("caret");
        if (!answer.textContent) answer.textContent = "(no answer)";
      }
    }
  } catch (err) {
    answer.classList.remove("caret");
    answer.textContent = "Connection error: " + err.message;
  }
  busy = false; send.disabled = false; input.focus(); scroll();
});

function scroll() { log.scrollTop = log.scrollHeight; }
</script>
</body>
</html>
